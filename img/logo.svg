<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" role="img" aria-label="Rumbosur">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263F35"/>
      <stop offset="1" stop-color="#65765A"/>
    </linearGradient>
  </defs>
  <rect width="260" height="60" fill="#ffffff"/>
  <!-- Icon: compass + mountain -->
  <g transform="translate(6,6)">
    <circle cx="24" cy="24" r="22" fill="none" stroke="url(#g)" stroke-width="2.5"/>
    <circle cx="24" cy="24" r="1.6" fill="#263F35"/>
    <!-- mountain silhouette -->
    <path d="M6 34 L14 22 L20 28 L26 18 L32 26 L40 34 Z" fill="#65765A" opacity="0.85"/>
    <!-- south needle -->
    <path d="M24 24 L21 36 L24 34 L27 36 Z" fill="#8A7159"/>
    <path d="M24 24 L22 16 L24 18 L26 16 Z" fill="#263F35" opacity="0.6"/>
    <!-- cardinal ticks -->
    <g stroke="#263F35" stroke-width="1.2" stroke-linecap="round">
      <line x1="24" y1="4" x2="24" y2="7"/>
      <line x1="24" y1="41" x2="24" y2="44"/>
      <line x1="4" y1="24" x2="7" y2="24"/>
      <line x1="41" y1="24" x2="44" y2="24"/>
    </g>
  </g>
  <!-- Wordmark -->
  <text x="62" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="600" letter-spacing="2" fill="#263F35">RUMBOSUR</text>
  <line x1="62" y1="44" x2="250" y2="44" stroke="#8A7159" stroke-width="1" opacity="0.5"/>
  <text x="62" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" letter-spacing="3" fill="#65765A">ASESORÍA PARA VIVIR EN EL SUR</text>
</svg>